name: Apply HLS segment thrash fix

on:
  push:
    branches:
      - fix/hls-segment-thrashing

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/hls-segment-thrashing

      - name: Patch HLS media segment scheduling
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("server.js")
          text = path.read_text()
          old = '''                targetSequenceNumber !== sequenceNumber && (convertMutex.cancel(), stop());
                const release = await convertMutex.acquire();'''
          new = '''                const release = await convertMutex.acquire();'''

          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text)
              print("Patched HLS mediaSegment scheduling")
          elif new in text:
              print("Patch already applied")
          else:
              raise SystemExit("Expected mediaSegment scheduling block was not found")
          PY

      - name: Validate server.js
        run: node --check server.js

      - name: Commit patched server.js
        shell: bash
        run: |
          if git diff --quiet -- server.js; then
            echo "No server.js changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js
          git commit -m "Fix HLS segment converter thrashing"
          git push origin HEAD:fix/hls-segment-thrashing
