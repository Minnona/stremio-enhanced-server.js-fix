name: Apply HLS segment thrash fix

on:
  push:
    branches:
      - fix/hls-segment-thrashing

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/hls-segment-thrashing

      - name: Patch HLS media segment scheduling
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("server.js")
          text = path.read_text()
          needle = "targetSequenceNumber !== sequenceNumber && (convertMutex.cancel(), stop());"
          lines = text.splitlines(keepends=True)
          matches = [i for i, line in enumerate(lines) if needle in line]

          if len(matches) == 1:
              del lines[matches[0]]
              path.write_text("".join(lines))
              print("Patched HLS mediaSegment scheduling: concurrent requests now queue instead of killing the active FFmpeg process")
          elif len(matches) == 0:
              print("Patch already applied")
          else:
              raise SystemExit(f"Expected exactly one HLS cancellation line, found {len(matches)}")
          PY

      - name: Validate server.js
        run: node --check server.js

      - name: Verify patch
        shell: bash
        run: |
          if grep -Fq 'targetSequenceNumber !== sequenceNumber && (convertMutex.cancel(), stop());' server.js; then
            echo 'HLS cancellation line still present'
            exit 1
          fi

      - name: Commit patched server.js
        shell: bash
        run: |
          if git diff --quiet -- server.js; then
            echo "No server.js changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js
          git commit -m "Fix HLS segment converter thrashing"
          git push origin HEAD:fix/hls-segment-thrashing
