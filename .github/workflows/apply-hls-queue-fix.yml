name: Apply HLS queue fix

on:
  push:
    branches:
      - fix/hls-segment-thrashing

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/hls-segment-thrashing

      - name: Patch HLS queued seek handling
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("server.js")
          text = path.read_text()
          old = '                    targetSequenceNumber !== sequenceNumber && await seek(targetSequenceNumber);'
          new = '                    targetSequenceNumber !== sequenceNumber && (stop(), await seek(targetSequenceNumber));'

          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text)
              print("Patched queued HLS seeks to stop the current converter only after acquiring the mutex")
          elif new in text:
              print("Patch already applied")
          else:
              raise SystemExit("Expected queued seek line was not found")
          PY

      - name: Validate server.js
        run: node --check server.js

      - name: Verify no pre-lock cancellation regression
        shell: bash
        run: |
          if grep -Fq 'targetSequenceNumber !== sequenceNumber && (convertMutex.cancel(), stop());' server.js; then
            echo 'Old pre-lock cancellation line is present'
            exit 1
          fi
          grep -Fq 'targetSequenceNumber !== sequenceNumber && (stop(), await seek(targetSequenceNumber));' server.js

      - name: Commit patched server.js
        shell: bash
        run: |
          if git diff --quiet -- server.js; then
            echo "No server.js changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js
          git commit -m "Fix queued HLS seek converter cleanup"
          git push origin HEAD:fix/hls-segment-thrashing
